secrets:
  DOG_API_TOKEN:
    file: ./compose_secrets.txt
  DOG_AGENT_BROKER_PASSWORD:
    file: ./compose_secrets.txt
  DOG_TRAINER_SMTP_PASSWORD:
    file: ./compose_secrets.txt
  DOG_TRAINER_DB_PASSWORD:
    file: ./compose_secrets.txt
  DOG_TRAINER_BROKER_PASSWORD:
    file: ./compose_secrets.txt

services:
  #control:
  #  container_name: "control"
  #  build:
  #    context: "./control"
  #  #ports:
  #  #- "22:22"
  #  environment:
  #    - DOG_API_TOKEN=/var/run/dog_api_token
  #    - DOG_API_ENDPOINT=http://kong:8000/api/V2
  #    - TF_VAR_dog_api_token_docker=/var/run/dog_api_token
  #  secrets:
  #    - DOG_API_TOKEN
  #  depends_on:
  #    - "dog_trainer"
  #    - "dog_agent_1"

  csc:
    container_name: "csc"
    build:
      context: "./csc"
    environment:
      - NGINX_PORT=9000
      - VIRTUAL_HOST=dog
      - VIRTUAL_PATH=/csc
      - PORT=9000
    ports:
     - "9000:9000"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 5s
      retries: 10
  dog_agent_1:
    container_name: "dog-agent-1"
    hostname: "dog-agent-1"
    build:
      context: "./dog_agent"
      dockerfile: Dockerfile.local_deploy
    depends_on:
      - "csc"
      - "dog_trainer"
      - "rabbitmq"
    cap_add:
      - NET_ADMIN
    environment:
      - SHELL=/bin/sh
      - CERT_SOURCE=csc
      - DOG_GROUP=local_group
    secrets:
      - DOG_AGENT_BROKER_PASSWORD

  dog_agent_2:
    container_name: "dog-agent-2"
    hostname: "dog-agent-2"
    build:
      context: "./dog_agent"
      dockerfile: Dockerfile.local_deploy
    depends_on:
      - "csc"
      - "dog_trainer"
      - "rabbitmq"
    cap_add:
      - NET_ADMIN
    environment:
      - SHELL=/bin/sh
      - CERT_SOURCE=csc
      - DOG_GROUP=local_group
    secrets:
      - DOG_AGENT_BROKER_PASSWORD
  nginx-proxy:
    container_name: "nginx-proxy"
    image: jwilder/nginx-proxy:alpine
    ports:
      - "80:80"
    privileged: true
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      #- /var/run/podman/podman.sock:/tmp/docker.sock:ro
    environment:
      - DEFAULT_HOST=dog
    depends_on:
      - "kong"
      - "dog_park"
  dog_park:
    container_name: "dog-park"
    build: "./dog_park"
    environment:
      - NGINX_PORT=3030
      - REACT_APP_DOG_API_HOST=http://dog
      - VIRTUAL_HOST=dog
      - VIRTUAL_PATH=/
    depends_on:
      - "dog_trainer"
  dog_trainer:
    environment:
      - VIRTUAL_PORT=7070
      - VIRTUAL_HOST=dog
      - VIRTUAL_PATH=/api
    container_name: "dog-trainer"
    build:
      context: "./dog_trainer"
      dockerfile: Dockerfile.local_deploy
    depends_on:
      csc:
        condition: service_healthy
      rethinkdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "7070:7070"
    volumes:
      - ./dog_trainer_home:/root
    secrets:
      - DOG_TRAINER_SMTP_PASSWORD
      - DOG_TRAINER_DB_PASSWORD
      - DOG_TRAINER_BROKER_PASSWORD

  kong:
    container_name: "kong"
    build:
      context: "./kong"
      dockerfile: Dockerfile
    environment:
      - VIRTUAL_HOST=kong
      - VIRTUAL_PATH=/api
      - KONG_DATABASE=off
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
      - KONG_DECLARATIVE_CONFIG=/kong.yml
    depends_on:
      - "csc"
      - "dog_trainer"
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
  rethinkdb:
    container_name: "rethinkdb"
    build:
      context: "./rethinkdb"
      dockerfile: Dockerfile
    image: "rethinkdb"
    ports:
      - "8080:8080"
      - "28015:28015"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/28015"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    container_name: "rabbitmq"
    build: ./rabbitmq
      #image: "rabbitmq:management"
    environment:
      - RABBITMQ_DEFAULT_VHOST=dog
    ports:
      - "5673:5673"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      - "csc"
